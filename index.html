<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kvapka</title>
    <meta name="description" content="kvapka — návrhář rozložení Power BI reportů." />
    <meta name="theme-color" content="#0b5f7a" />

    <link rel="icon" type="image/svg+xml" href="assets/img/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="assets/img/favicon/favicon-96x96.png" />
    <link rel="shortcut icon" href="assets/img/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/img/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/theme-editor.css" />
</head>

<body>
    <button id="notification-bell" class="notification-bell" aria-label="Oznámení" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M10 20a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
    </button>

    <div id="notification-panel" class="notification-panel">
        <div class="notification-panel-header">
            <h3>Oznámení</h3>
        </div>
        <div id="notification-list" class="notification-list"></div>
    </div>

    <header class="topbar">
        <a class="brand" href="./" aria-label="kvapka">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                <defs>
                    <linearGradient id="kv-drop" x1="8" y1="4" x2="24" y2="30" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#3fc3e6" />
                        <stop offset="1" stop-color="#0b5f7a" />
                    </linearGradient>
                </defs>
                <path d="M16 3.5C16 3.5 6.5 14 6.5 19.75a9.5 9.5 0 0 0 19 0C25.5 14 16 3.5 16 3.5Z" fill="url(#kv-drop)" />
                <path d="M11.25 20.5a4.75 4.75 0 0 0 3 4.4" stroke="#fff" stroke-opacity=".85" stroke-width="1.8" stroke-linecap="round" fill="none" />
            </svg>
            <span class="brand-name">kvapka</span>
        </a>
        <span class="topbar-subtitle">návrh rozložení reportu</span>

        <div class="topbar-actions">
            <button id="export-layout" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Exportovat rozložení</span>
            </button>
        </div>
    </header>

    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-panels">
                <section class="panel">
                    <h2>Šablona</h2>
                    <div class="panel-field">
                        <h3 class="field-label" id="label-resolution">Rozlišení</h3>
                        <!-- Chips are built by ui/themePicker.js: the two built-in
                             presets first, then every saved custom theme. -->
                        <div class="theme-selector" id="theme-selector" role="group" aria-labelledby="label-resolution"></div>
                        <button type="button" class="btn btn-dashed full-btn" id="new-theme">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <span>Vlastní šablona…</span>
                        </button>
                    </div>

                    <div class="panel-field">
                        <h3 class="field-label" id="label-theme-scope">Platnost šablony</h3>
                        <div class="template-selector segmented" role="group" aria-labelledby="label-theme-scope">
                            <button type="button" class="template-option theme-scope-option active" data-scope="page">Tato stránka</button>
                            <button type="button" class="template-option theme-scope-option" data-scope="global">Všechny</button>
                        </div>
                        <p class="field-note" id="theme-scope-note"></p>
                    </div>

                    <div class="panel-field">
                        <h3 class="field-label" id="label-slicer-placement">Slicery</h3>
                        <!-- Each option is a whole layout, not a view of one:
                             picking it switches to a template built for that
                             shape (ui/themePicker.js). An option with no
                             template of its own is disabled rather than
                             conjuring one. -->
                        <div class="template-selector segmented segmented--3" role="group" aria-labelledby="label-slicer-placement">
                            <button type="button" class="template-option active" data-placement="horizontal">Nahoře</button>
                            <button type="button" class="template-option" data-placement="vertical-left">Vlevo</button>
                            <button type="button" class="template-option" data-placement="vertical-right">Vpravo</button>
                        </div>
                        <p class="field-note" id="placement-note"></p>
                    </div>

                    <div class="panel-section panel-rows">
                        <!-- Collapses away in vertical mode: a single slicer column
                             has no per-row limit to set. -->
                        <div class="collapsible expanded" id="slicers-per-row-field">
                            <div class="collapsible-inner">
                                <div class="panel-row">
                                    <label for="slicers-per-row">Slicery na řádek</label>
                                    <!-- Options come from the active theme's
                                         min/max per-row bounds (themePicker.js). -->
                                    <select id="slicers-per-row"></select>
                                </div>
                            </div>
                        </div>

                        <div class="panel-row">
                            <label for="kpis-per-row">KPI na řádek</label>
                            <select id="kpis-per-row"></select>
                        </div>
                    </div>

                    <button id="reset-layout" class="btn btn-ghost full-btn reset-layout-btn">Reset layoutu</button>
                </section>

                <section class="panel panel--selection">
                    <h2>Vybraný element</h2>
                    <div id="no-selection" class="collapsible expanded">
                        <div class="collapsible-inner"><p class="empty-hint">Klikněte na element v náhledu. Najetím na něj se zobrazí jeho ovládání.</p></div>
                    </div>

                    <div id="selection-details" class="collapsible">
                        <div class="collapsible-inner">
                            <div class="sel-row"><strong>Typ</strong> <span id="sel-type" class="sel-value"></span></div>
                            <div class="sel-row"><strong>Index</strong> <span id="sel-index" class="sel-value"></span></div>
                            <div class="sel-row">
                                <strong>Šířka</strong>
                                <span class="editable-value" id="edit-width-wrapper" tabindex="0" title="Dvojklikem upravit hodnotu">
                                    <span id="sel-width"></span><span class="unit">px</span>
                                </span>
                                <input id="input-width" type="number" class="inline-edit-input hidden" />
                                <button class="copy-btn edit-pencil-btn push-right" type="button" id="edit-width-pencil" title="Upravit hodnotu" aria-label="Upravit šířku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                <button class="copy-btn" type="button" data-copy-target="sel-width" title="Kopírovat hodnotu" aria-label="Kopírovat šířku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                            <div class="sel-row">
                                <strong>Výška</strong>
                                <span class="editable-value" id="edit-height-wrapper" tabindex="0" title="Dvojklikem upravit hodnotu">
                                    <span id="sel-height"></span><span class="unit">px</span>
                                </span>
                                <input id="input-height" type="number" class="inline-edit-input hidden" />
                                <button class="copy-btn edit-pencil-btn push-right" type="button" id="edit-height-pencil" title="Upravit hodnotu" aria-label="Upravit výšku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                <button class="copy-btn" type="button" data-copy-target="sel-height" title="Kopírovat hodnotu" aria-label="Kopírovat výšku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                            <div class="sel-row"><strong>X</strong> <span class="editable-value"><span id="sel-x"></span><span class="unit">px</span></span>
                                <button class="copy-btn push-right" type="button" data-copy-target="sel-x" title="Kopírovat hodnotu" aria-label="Kopírovat hodnotu X">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                            <div class="sel-row"><strong>Y</strong> <span class="editable-value"><span id="sel-y"></span><span class="unit">px</span></span>
                                <button class="copy-btn push-right" type="button" data-copy-target="sel-y" title="Kopírovat hodnotu" aria-label="Kopírovat hodnotu Y">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>

                            <button id="apply-selection" class="btn btn-primary full-btn hidden" disabled>Použít změny</button>
                        </div>
                    </div>
                </section>
                <section class="panel add-elements">
                    <h2>Přidat</h2>
                    <div class="button-group">
                        <button id="add-slicer" class="btn btn-secondary full-btn"><span class="swatch swatch--slicer" aria-hidden="true"></span>Slicer</button>
                        <button id="add-kpi" class="btn btn-secondary full-btn"><span class="swatch swatch--kpi" aria-hidden="true"></span>KPI</button>
                        <button id="add-chart-split" class="btn btn-secondary full-btn hidden"><span class="swatch swatch--chart" aria-hidden="true"></span>Graf</button>
                    </div>
                    <!-- Filled with one button per KPI band beyond the first
                         (see syncKpiBandControls in app.js). Empty when the
                         active theme defines only the header band. -->
                    <div id="add-kpi-bands"></div>
                </section>

            </div>
        </aside>

        <main class="main">
            <div id="tab-bar" class="tab-bar" role="tablist" aria-label="Stránky reportu"></div>

            <div id="canvas-wrapper">
                <div id="canvas"></div>
                <!-- Filled by syncTemplateControls() in app.js. -->
                <p class="sheet-caption" id="canvas-size-label"></p>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
