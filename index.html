<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KB Report Layout Designer</title>

    <link rel="icon" type="image/svg+xml" href="assets/img/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="assets/img/favicon/favicon-96x96.png" />
    <link rel="shortcut icon" href="assets/img/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/img/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
    <button id="notification-bell" class="notification-bell" aria-label="Oznámení" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10,21h4a2,2,0,0,1-4,0ZM3.076,18.383a1,1,0,0,1,.217-1.09L5,15.586V10a7.006,7.006,0,0,1,6-6.92V2a1,1,0,0,1,2,0V3.08A7.006,7.006,0,0,1,19,10v5.586l1.707,1.707A1,1,0,0,1,20,19H4A1,1,0,0,1,3.076,18.383ZM6.414,17H17.586l-.293-.293A1,1,0,0,1,17,16V10A5,5,0,0,0,7,10v6a1,1,0,0,1-.293.707Z" />
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
    </button>

    <div id="notification-panel" class="notification-panel">
        <div class="notification-panel-header">
            <h3>Oznámení</h3>
        </div>
        <div id="notification-list" class="notification-list"></div>
    </div>

    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/img/kb-logo.svg" alt="Komerční banka" class="brand-logo" />
                <div class="brand-text">
                    <h1>Report Layout Designer</h1>
                </div>
            </div>

            <div class="sidebar-panels">
                <section class="panel">
                    <div class="panel-header">
                        <h2>Šablona layoutu</h2>
                        <button type="button" class="info-trigger" aria-label="Rozměry plátna">
                            i
                            <span class="tooltip" id="canvas-size-label" role="tooltip">Power BI plátno 1920 × 1080</span>
                        </button>
                    </div>
                    <div class="template-selector" role="group" aria-label="Layout template">
                        <button type="button" class="template-option active" data-template="FULL_HD">FULL HD</button>
                        <button type="button" class="template-option" data-template="HD">HD</button>
                    </div>

                    <div class="panel-section row-limit-controls">
                        <label for="slicers-per-row">Slicery na řádek</label>
                        <select id="slicers-per-row">
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7" selected>7</option>
                        </select>

                        <label for="kpis-per-row">KPI na řádek</label>
                        <select id="kpis-per-row">
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6" selected>6</option>
                            <option value="7">7</option>
                        </select>
                    </div>

                    <button id="reset-layout" class="full-btn reset-layout-btn">Reset layoutu</button>
                </section>

                <section class="panel">
                    <h2>Vybraný element</h2>
                    <div id="no-selection" class="collapsible expanded">
                        <div class="collapsible-inner">Klikněte na element v náhledu.</div>
                    </div>

                    <div id="selection-details" class="collapsible">
                        <div class="collapsible-inner">
                            <div><strong>Typ:</strong> <span id="sel-type"></span></div>
                            <div><strong>Index:</strong> <span id="sel-index"></span></div>
                            <div class="sel-row"><strong>X:</strong> <span id="sel-x"></span> px
                                <button class="copy-btn push-right" type="button" data-copy-target="sel-x" title="Kopírovat hodnotu" aria-label="Kopírovat hodnotu X">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                            <div class="sel-row"><strong>Y:</strong> <span id="sel-y"></span> px
                                <button class="copy-btn push-right" type="button" data-copy-target="sel-y" title="Kopírovat hodnotu" aria-label="Kopírovat hodnotu Y">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                            <div class="sel-row">
                                <strong>Šířka:</strong>
                                <span class="editable-value" id="edit-width-wrapper" tabindex="0" title="Dvojklikem upravit hodnotu">
                                    <span id="sel-width"></span><span class="unit">px</span>
                                </span>
                                <input id="input-width" type="number" class="inline-edit-input hidden" />
                                <button class="copy-btn edit-pencil-btn push-right" type="button" id="edit-width-pencil" title="Upravit hodnotu" aria-label="Upravit šířku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                <button class="copy-btn" type="button" data-copy-target="sel-width" title="Kopírovat hodnotu" aria-label="Kopírovat šířku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                            <div class="sel-row">
                                <strong>Výška:</strong>
                                <span class="editable-value" id="edit-height-wrapper" tabindex="0" title="Dvojklikem upravit hodnotu">
                                    <span id="sel-height"></span><span class="unit">px</span>
                                </span>
                                <input id="input-height" type="number" class="inline-edit-input hidden" />
                                <button class="copy-btn edit-pencil-btn push-right" type="button" id="edit-height-pencil" title="Upravit hodnotu" aria-label="Upravit výšku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                <button class="copy-btn" type="button" data-copy-target="sel-height" title="Kopírovat hodnotu" aria-label="Kopírovat výšku">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>

                            <button id="apply-selection" class="hidden" disabled>Použít změny</button>
                        </div>
                    </div>
                </section>

                <section class="panel add-elements">
                    <h2>Přidání elementů</h2>
                    <div class="button-group">
                        <button id="add-slicer" class="full-btn">Slicer</button>
                        <button id="add-kpi" class="full-btn">KPI</button>
                    </div>
                </section>
            </div>

            <div class="reset-layout-wrapper">
                <button id="export-layout" class="full-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Exportovat rozložení</span>
                </button>
            </div>
        </aside>

        <main class="main">
            <h2>Náhled layoutu</h2>
            <p class="hint">
                Najetím myší na element se zobrazí tlačítka <strong>+</strong> a <strong>×</strong>.
                Kliknutím na element zobrazíte jeho parametry v levém panelu.
            </p>

            <div id="tab-bar" class="tab-bar" role="tablist" aria-label="Stránky reportu"></div>

            <div id="canvas-wrapper">
                <div id="canvas"></div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
